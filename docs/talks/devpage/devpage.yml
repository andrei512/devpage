context: >
  A short talk for software developers who use AI coding agents. It explains
  what devpage is and why it helps: the agent writes the project's documents
  in the repository, devpage shows them as live pages, and you review them in
  the browser. Many listeners are not native English speakers, so speak
  clearly, at a calm pace, with simple words. Friendly and confident, never
  pushy.
