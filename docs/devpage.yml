# devpage's own documentation, served by devpage.
kind: site
title: devpage
root: README.md
widgets: widgets
structure: structure
logo: logo.svg
navbar:
  Docs (book-open): README.md
  Getting started (rocket): getting-started.md
  Examples (layout-grid):
    Site — these docs (book-open): README.md
    Doc — feature catalog (file-text): features/devpage.yml
    Slides — the devpage talk (presentation): talks/devpage/devpage.yml
    Design — the checkout prototype (frame): designs/checkout/checkout.design
  (github): https://github.com/andrei512/devpage
watch:
  - "**/*.md"
  - "**/*.yml"
  - "**/*.design"
extensions:
  requirements:
    config:
      tests:
        - name: rust
          glob: "../**/*.rs"
          pattern: '#\[spec\("([^"]+)"\)\]'
          run: "RUSTC_BOOTSTRAP=1 cargo test -- -Z unstable-options --format junit"
  code:
    config:
      rust:
        files:
          - "../core/src/**/*.rs"
          - "../design/src/**/*.rs"
          - "../src/**/*.rs"
          - "../extension-api/src/**/*.rs"
        private: true
