# devpage server on Kubernetes: a StatefulSet of one, its PVC, a Service,
# and the Secret its environment comes from. Copy it and change the image,
# the bucket and the storage class:
#
#   docker build deploy/server --build-arg DEVPAGE_VERSION=<version> -t <registry>/devpage-server:<version>
#   kubectl apply -f deploy/server/kubernetes.yaml
#
# One replica, always: the store is one SQLite file with one writer, and
# nothing coordinates two servers. The PVC is only a cache — the bucket holds
# every version and Litestream's copy of the store — so a pod on a new, empty
# volume restores the store and refills the cache by itself.
apiVersion: v1
kind: Secret
metadata:
  name: devpage
type: Opaque
stringData:
  DEVPAGE_BUCKET_URL: s3://docs-bucket/devpage # or az://container/devpage
  # The bucket's credentials, when there is no workload identity. With one —
  # IRSA, EKS Pod Identity, Azure Workload Identity — leave these out: the
  # SDKs' own chains find it.
  AWS_REGION: eu-west-1
  AWS_ACCESS_KEY_ID: replace-me
  AWS_SECRET_ACCESS_KEY: replace-me
---
apiVersion: v1
kind: Service
metadata:
  name: devpage
spec:
  selector:
    app: devpage
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: devpage
spec:
  serviceName: devpage
  replicas: 1
  selector:
    matchLabels:
      app: devpage
  template:
    metadata:
      labels:
        app: devpage
    spec:
      containers:
        - name: devpage
          image: registry.example.com/devpage-server:latest
          ports:
            - name: http
              containerPort: 3030
          envFrom:
            - secretRef:
                name: devpage
          env:
            - name: DEVPAGE_HOST
              value: 0.0.0.0
            - name: DEVPAGE_DATA_DIR
              value: /data
            # The header your proxy names the user in; leave it out and
            # every write is `anonymous`.
            # - name: DEVPAGE_USER_HEADER
            #   value: X-Forwarded-Email
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        # The cache takes 80% of it unless DEVPAGE_CACHE_MAX_BYTES says otherwise.
        resources:
          requests:
            storage: 10Gi
