# Try the deployed devpage locally: docker compose -f deploy/compose.yaml up --build
# then open http://localhost:8090. Only the proxy is published, as on a cluster.
services:
  devpage:
    build: .
    volumes:
      - comments:/srv/.devpage
  proxy:
    image: caddy:2
    ports:
      - "8090:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - devpage
volumes:
  comments:
