[workspace]
members = ["cargo:."]

# Prebuilt binaries on a GitHub Release, built when a version tag is pushed,
# and the installers that fetch them: docs/boxes/engineering/sdlc/stages/README.md#release.
[dist]
cargo-dist-version = "0.34.0"
ci = "github"
installers = ["shell", "powershell"]
# glibc, not musl, on Linux: devpage loads native extensions with dlopen.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# gzip, not xz: a bare Linux, a slim container's, has no xz to unpack with.
unix-archive = ".tar.gz"
install-path = "~/.local/bin/"
install-updater = false
pr-run-mode = "plan"
# A release builds rarely; its caches would only evict the gates'.
cache-builds = false
