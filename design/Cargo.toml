[package]
name = "devpage-design"
version = "0.2.2"
edition = "2024"
rust-version = "1.89"
description = "The design engine: parses, resolves, lays out and paints devpage designs"
license = "MIT"
repository = "https://github.com/andrei512/devpage"

[dependencies]
parley = { version = "0.12.0", default-features = false, features = ["std"] }
taffy = { version = "0.15.1", default-features = false, features = ["std", "taffy_tree", "flexbox", "content_size"] }
vello_cpu = "0.3.0"
prost = "0.14.4"
png = "0.18.1"
zune-jpeg = "0.5.15"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
guillotiere = "0.7.0"
tonic = { version = "0.14.6", default-features = false, features = ["codegen"], optional = true }
tonic-prost = { version = "0.14.6", optional = true }
rstar = "0.13"

[features]
# The server side of the `Designs` watch service, which `devpage` serves.
server = ["dep:tonic", "dep:tonic-prost"]

[build-dependencies]
protox = "0.10.0"
tonic-prost-build = { version = "0.14.6", default-features = false }
