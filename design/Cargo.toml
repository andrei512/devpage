[package]
name = "devpage-design"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "The design engine: parses, resolves, lays out and paints devpage designs"
license = "MIT"
publish = false

[dependencies]
parley = "0.12.0"
taffy = { version = "0.15.1", default-features = false, features = ["std", "taffy_tree", "flexbox", "content_size"] }
vello_cpu = "0.3.0"
prost = "0.14.4"

[build-dependencies]
prost-build = "0.14.4"
protox = "0.10.0"
