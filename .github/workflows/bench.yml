# The server's benchmark, run by hand from the Actions tab: the image built
# from this checkout, held to the envelope's 2 CPUs and 4 GB against RustFS,
# loaded by devpage-bench with a corpus generated from the seed. The report
# goes on the run's summary page beside main's last run; the numbers are the
# run's artifact, which the next run reads as its baseline.
# GitHub-hosted runners only: this repository is public and never uses a
# self-hosted runner.
name: bench

on:
  workflow_dispatch:
    inputs:
      seed:
        description: The corpus's seed
        default: "1"
      scale:
        description: 1 is the envelope; 0.01 a short run
        default: "1"
      runs:
        description: Runs of each scenario; the median is reported
        default: "3"
      scenarios:
        description: Which scenarios, comma-separated
        default: views,misses,writes,herd,open,knee,soak

permissions:
  contents: read
  actions: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: devpage-bench
        run: cargo build --release --locked -p devpage-bench
      - name: The server, held to the envelope's pod
        run: >
          docker compose -f deploy/server/compose.yaml -f bench/compose.yaml
          up --build --detach --wait devpage-s3
      - name: Main's last run, the baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow bench.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run" ]; then
            gh run download "$run" --name bench --dir baseline || true
          fi
      - name: The container's memory, every 5 seconds
        run: |
          nohup sh -c 'while true; do
            docker stats --no-stream --format "{{.MemUsage}}" server-devpage-s3-1 >> memory.txt
            sleep 5
          done' > /dev/null 2>&1 &
      - name: The benchmark
        env:
          SEED: ${{ inputs.seed }}
          SCALE: ${{ inputs.scale }}
          RUNS: ${{ inputs.runs }}
          SCENARIOS: ${{ inputs.scenarios }}
        run: >
          target/release/devpage-bench
          --server http://127.0.0.1:3031 --metrics http://127.0.0.1:9031/metrics
          --docs docs --seed "$SEED" --scale "$SCALE"
          --runs "$RUNS" --scenarios "$SCENARIOS"
          --out results.json --report report.md --baseline baseline/results.json
      - name: The report, on the summary page
        if: always()
        run: |
          cat report.md >> "$GITHUB_STEP_SUMMARY" || true
          if [ -s memory.txt ]; then
            printf '\nMemory as Docker saw the container, at its highest: %s\n' \
              "$(cut -d/ -f1 memory.txt | sort -h | tail -1)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: |
            results.json
            report.md
            memory.txt
          retention-days: 90
      - name: Logs
        if: failure()
        run: docker compose -f deploy/server/compose.yaml -f bench/compose.yaml logs devpage-s3 | tail -200
