# The gates — formatting, clippy, the tests and devpage's own docs, on Linux
# and Windows — on every
# pull request and every push to main, a design branch or a prototype; and the
# install page kept true: a checkout installs with only what
# docs/installing.md lists. GitHub-hosted runners only: this repository is
# public and never uses a self-hosted runner.
name: gates

on:
  pull_request:
  push:
    # Tickets merge into a design branch without a pull request, so a push
    # there is what gates them.
    branches: [main, "design/**", "prototype/**"]

permissions:
  contents: read

jobs:
  gates:
    # devpage runs on Linux, macOS and Windows; macOS is where it is
    # developed, so CI gates the other two.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: The toolchain rust-toolchain.toml names, with rustfmt and clippy
        run: |
          rustup toolchain install
          rustup component add rustfmt clippy
      # The dependencies, built, from the last run with the same Cargo.lock
      # and toolchain — kept when a run fails too, so a red run doesn't make
      # the next build every dependency again; devpage's own crates are
      # always built afresh.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: The docs pass devpage check, external links too
        run: cargo run --locked -- check docs

  install:
    runs-on: ubuntu-latest
    container: rust:1.97-slim-bookworm
    env:
      # Inside the checkout, where the cache below keeps it.
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v4
      # Keyed on Cargo.lock and the toolchain, so a change to either builds
      # every dependency again with nothing added. Not the installed binary:
      # a cached one would make the install below a no-op.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-on-failure: true
      - name: Install from the checkout with nothing added
        run: cargo install --path . --locked
      - run: devpage --version

  # The same on Windows, beside the Chrome tests rather than before them.
  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-on-failure: true
      - name: Install from the checkout with nothing added
        run: cargo install --path . --locked
      - run: devpage --version

  # The Chrome tests on Windows — pages, PDFs, slide PNGs, designs, videos —
  # on the pinned Chrome.
  chrome-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: The Chrome tests
        # Two at a time: WARP draws in software on the runner's few cores, and
        # more at once starve each other past the tests' waits.
        run: cargo test --locked --bin devpage -- --ignored --test-threads=2
        # The runner has no GPU: WARP, Direct3D's software adapter, stands in.
        env:
          DEVPAGE_TEST_SOFTWARE_GPU: "1"

