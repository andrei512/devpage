name: gates

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  push:
    branches: [main, "design/**", "prototype/**"]

permissions:
  contents: read
  actions: read

env:
  DEVPAGE_CHECKS_MODE: ${{ vars.DEVPAGE_CHECKS_MODE || vars.DEVPAGE_BROWSER_MODE || 'affected' }}

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      linux: ${{ steps.plan.outputs.linux }}
      windows: ${{ steps.plan.outputs.windows }}
      live: ${{ steps.plan.outputs.live }}
      browser: ${{ steps.plan.outputs.browser }}
      inventory: ${{ steps.plan.outputs.inventory }}
      install: ${{ steps.plan.outputs.install }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the affected checks
        id: plan
        uses: ./.github/actions/browser-selection
        with:
          workflow: gates.yml
          full: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      - name: Share the exact plan with the platform runners
        if: steps.plan.outputs.linux == 'true' || steps.plan.outputs.windows == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: affected-check-plan
          path: ${{ runner.temp }}/devpage-check-plan.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  gates:
    needs: select
    if: needs.select.outputs.linux == 'true' || needs.select.outputs.windows == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: affected-check-plan
          path: ${{ runner.temp }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - if: matrix.rust
        name: Set up the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup component add rustfmt clippy
      - if: matrix.rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: runner.os == 'Linux' && needs.select.outputs.live == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - if: runner.os == 'Linux' && needs.select.outputs.live == 'true'
        name: Install the live session's pinned dependencies
        working-directory: live
        run: bun install --frozen-lockfile
      - name: Run affected project checks
        shell: bash
        run: node tools/checks/run.mjs --ci --plan-file "$RUNNER_TEMP/devpage-check-plan.json" --non-browser
      - if: runner.os == 'Windows' && needs.select.outputs.inventory == 'true'
        name: Reconcile browser test inventory
        run: node tools/browser-tests/inventory.mjs
      - if: runner.os == 'Windows' && needs.select.outputs.browser == 'true'
        name: Run selected browser tests in one Cargo process
        run: node tools/browser-tests/execute-ci.mjs

  install:
    needs: select
    if: needs.select.outputs.install == 'true'
    runs-on: ubuntu-latest
    container: rust:1.97-slim-bookworm
    env:
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install from the checkout with nothing added
        run: cargo install --path . --locked
      - run: devpage --version
