# The gates — formatting, clippy, the tests and devpage's own docs, on Linux
# and Windows — on every
# pull request and every push to main, a design branch or a prototype; and the
# install page kept true: a checkout installs with only what
# docs/installing.md lists. GitHub-hosted runners only: this repository is
# public and never uses a self-hosted runner.
name: gates

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  push:
    # Tickets merge into a design branch without a pull request, so a push
    # there is what gates them.
    branches: [main, "design/**", "prototype/**"]

permissions:
  contents: read
  actions: read

env:
  DEVPAGE_BROWSER_MODE: ${{ vars.DEVPAGE_BROWSER_MODE }}

jobs:
  gates:
    # devpage runs on Linux, macOS and Windows; macOS is where it is
    # developed, so CI gates the other two.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["windows-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ runner.os == 'Windows' && '0' || '1' }}
          persist-credentials: false
      - name: The toolchain rust-toolchain.toml names, with rustfmt and clippy
        run: |
          rustup toolchain install
          rustup component add rustfmt clippy
      # The dependencies, built, from main's last run with the same
      # Cargo.lock and toolchain; devpage's own crates are always built
      # afresh. Only main saves: the repository's 10 GB of caches would
      # otherwise fill with each pull request's, evicting main's.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: cargo fmt --check
      - if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: cargo clippy --all-targets --locked -- -D warnings
      - if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: cargo test --locked
      - name: Select browser checks
        if: runner.os == 'Windows'
        id: browser
        uses: ./.github/actions/browser-selection
        with:
          workflow: gates.yml
          full: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      - name: Check selection rules
        if: runner.os == 'Windows' && steps.browser.outputs.verify == 'true'
        run: node --test "tools/browser-tests/*.test.mjs"
      - name: Reconcile browser test inventory
        if: runner.os == 'Windows' && steps.browser.outputs.rust == 'true'
        run: node tools/browser-tests/inventory.mjs
      - name: Run browser checks
        if: runner.os == 'Windows'
        run: node tools/browser-tests/execute-ci.mjs rust
      - name: The docs pass devpage check, external links too
        if: runner.os == 'Linux'
        run: cargo run --locked -- check docs

  install:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: rust:1.97-slim-bookworm
    env:
      # Inside the checkout, where the cache below keeps it.
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v4
      # Keyed on Cargo.lock and the toolchain, so a change to either builds
      # every dependency again with nothing added. Not the installed binary:
      # a cached one would make the install below a no-op.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install from the checkout with nothing added
        run: cargo install --path . --locked
      - run: devpage --version

