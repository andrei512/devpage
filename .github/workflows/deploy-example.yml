# Keeps the bundled example true: the image in deploy/bundled/ builds and serves.
# It installs the released crate from crates.io, so a change outside deploy/
# can't change it: it runs on a pull request that touches deploy/bundled/ or this
# file, on every push to main, and every Monday for what moves under it.
# GitHub-hosted runners only: this repository is public and never uses a
# self-hosted runner.
name: deploy example

on:
  pull_request:
    paths:
      - deploy/bundled/**
      - .github/workflows/deploy-example.yml
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and start it behind the proxy
        run: docker compose -f deploy/bundled/compose.yaml up --build --detach --wait
      - name: The docs load
        run: >
          curl -fsSL -o /dev/null --retry 10 --retry-all-errors --retry-delay 2
          http://localhost:8090/
      - name: A design's PNG is an image/png
        run: >
          test "$(curl -fsS -o /dev/null -w '%{content_type}'
          http://localhost:8090/docs/designs/checkout/button.design.png)" = image/png
      - name: A comment is accepted
        run: >
          curl -fsS -H 'Content-Type: application/json'
          -d '{"page":"docs/README.md","anchor":{"quote":"devpage"},"text":"CI"}'
          http://localhost:8090/__devpage/comments
      - name: The docs pass devpage check
        run: docker compose -f deploy/bundled/compose.yaml exec -T devpage devpage check docs
      - name: Logs
        if: failure()
        run: docker compose -f deploy/bundled/compose.yaml logs

