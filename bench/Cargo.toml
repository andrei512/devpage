[package]
name = "devpage-bench"
version = "0.0.0"
edition = "2024"
publish = false
description = "The server's benchmark: a seeded corpus, load at scheduled times, a report against the envelope's targets."

[dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
libc = "0.2.191"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
