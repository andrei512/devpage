[package]
name = "devpage"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Live documents from a repository: sites, docs and slides from Markdown, and UI designs drawn from code — with comments, link checking and PDF"
license = "MIT"
repository = "https://github.com/andrei512/devpage"
readme = "docs/README.md"
keywords = ["markdown", "documentation", "slides", "mermaid", "live-reload"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["deploy/", ".claude/", ".agents/", "docs/plan/", "AGENTS.md", "CLAUDE.md"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chromiumoxide = { version = "0.9.1", features = ["fetcher", "rustls", "zip8"] }
clap = { version = "4.6.7", features = ["derive"] }
comrak = "0.57.0"
futures = "0.3.34"
globset = "0.4.20"
ignore = "0.4.33"
mime_guess = "2.0.5"
notify = "8.2.1"
reqwest = "0.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
syntect = "5.3.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
two-face = "0.5.2"
devpage-design = { path = "design", version = "0.2.0", features = ["server"] }
tonic = { version = "0.14.6", default-features = false, features = ["router", "codegen"] }
tonic-web = "0.14.6"
tower = "0.5"

[dev-dependencies]
prost = "0.14.4"

# The design engine's WebAssembly module, which `cargo run -p
# devpage-design-module` builds into `assets/vendor/`: the page downloads it,
# so it is optimised for size.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[workspace]
members = [".", "design", "design/wasm", "design/module"]
default-members = [".", "design", "design/wasm", "design/module"]
