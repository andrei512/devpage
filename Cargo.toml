[package]
name = "devpage"
version = "0.2.2"
edition = "2024"
default-run = "devpage"
rust-version = "1.97"
description = "Live documents from a repository: sites, docs and slides from Markdown, and UI designs drawn from code — with comments, link checking and PDF"
license = "MIT"
repository = "https://github.com/andrei512/devpage"
readme = "docs/README.md"
keywords = ["markdown", "documentation", "slides", "mermaid", "live-reload"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["deploy/", ".github/", ".claude/", ".agents/", "docs/plan/", "AGENTS.md", "CLAUDE.md"]

[dependencies]
anyhow = "1.0.104"
async-tungstenite = { version = "0.32.1", features = ["tokio-runtime", "tokio-rustls-native-certs"] }
base64 = "0.22.1"
axum = "0.8.9"
chromiumoxide = { version = "0.9.1", features = ["fetcher", "rustls", "zip8"] }
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
mime_guess = "2.0.5"
notify = "8.2.1"
reqwest = "0.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
devpage-core = { path = "core", version = "0.2.2" }
devpage-design = { path = "design", version = "0.2.2", features = ["server"] }
tonic = { version = "0.14.6", default-features = false, features = ["codegen"] }
tonic-web = "0.14.6"
tower = "0.5"
rusqlite = { version = "0.41.0", features = ["bundled"] }
object_store = { version = "0.14.2", features = ["aws", "azure"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
uuid = { version = "1.29.0", features = ["v4"] }
url = "2.5.8"
sha2 = "0.10.9"

# The macOS watcher (`src/adapters/watch/macos.rs`): FSEvents streams on a dispatch
# queue, and kqueue.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-services = { version = "0.3.2", default-features = false, features = ["std", "FSEvents", "dispatch2"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFString"] }
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }
libc = "0.2.191"

[dev-dependencies]
devpage-core = { path = "core", version = "0.2.1", features = ["testing"] }
prost = "0.14.4"
brotli = "9.1.0"
flate2 = "1.1.10"

# The design engine's WebAssembly module, which `cargo run -p
# devpage-design-module` builds into `core/assets/vendor/`: the page downloads
# it, so it is optimised for size.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[workspace]
members = [".", "core", "design", "design/wasm", "design/module"]
default-members = [".", "core", "design", "design/wasm", "design/module"]

# The core's build.rs compresses the built-in assets with brotli at its best, which is
# slow unoptimised; optimise it in development builds too, and in release
# builds — `cargo install` among them — where a build script's dependencies
# are otherwise unoptimised.
[profile.dev.package.brotli]
opt-level = 3

[profile.release.package.brotli]
opt-level = 3

# QuickJS draws every diagram a page has; unoptimised it is many times slower.
[profile.dev.package.rquickjs-sys]
opt-level = 3

# The engine paints and compares pictures pixel by pixel — on the CPU through
# vello_cpu and its SIMD layer, to and from PNGs compressed by zlib-rs — and
# its tests, and the canvas's, paint hundreds.
# Unoptimised they take many times longer; optimised, an edit to the engine
# rebuilds about as fast. Debug assertions and overflow checks stay on.
[profile.dev.package.devpage-design]
opt-level = 3

[profile.dev.package.vello_cpu]
opt-level = 3

[profile.dev.package.vello_common]
opt-level = 3

[profile.dev.package.fearless_simd]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3

[profile.dev.package.comrak]
opt-level = 3

[profile.dev.package.onig_sys]
opt-level = 3

[profile.dev.package.syntect]
opt-level = 3
